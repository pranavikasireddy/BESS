battery:
  power_mw: 50
  energy_mwh: 200
  round_trip_efficiency: 0.88
  cycle_cost_eur_mwh: 3.0

market:
  aFRR_reserve_mw: 10
  rolling_horizon_boundary_soc_frac: 0.5
  # Fraction of energy_mwh the rolling-horizon LP must start/end each day
  # at (day one starts at 0 instead). Without this, solving each day in
  # isolation makes the LP always want to end at 0 SoC — see
  # src/optimisation.py: run_rolling_horizon_lp.
  imbalance_margin_eur_mwh: 30.0
  # Set via walk-forward validation (src/tune_imbalance_margin.py):
  # rolling 24-month train / 6-month test folds, sliding 6 months at a
  # time, spanning 2023-01 to 2025-09-30 (~2.75 years of genuinely
  # held-out data). Out-of-sample net revenue by fixed margin peaks in a
  # shallow plateau at 15-50 EUR/MWh (EUR 13.4-14.0M summed across
  # folds), with 30 the single best candidate tested (EUR 14.0M).
  #
  # A single-training-slice sweep (2021-2023 only) had previously picked
  # 125 as a "genuine interior optimum" (EUR 29.2M on that slice). It
  # does not generalize: out-of-sample it earns EUR 11.2M, ~20% below
  # the true best, because that training window is dominated by the
  # 2022 energy-crisis period's atypical volatility. Re-running the same
  # revenue-maximizing search on a rolling walk-forward basis doesn't
  # fix this either (EUR 11.9M) — the search itself keeps preferring
  # margins that overfit whichever window it's given, not just the one
  # fixed training slice. 30 also happens to be close to the original,
  # never-rigorously-tuned provisional placeholder.

grid:
  transport_eur_per_mw_year: 60650
  # PROVISIONAL — approximate, from TenneT's 2024 fixed annual "kW-contract"
  # capacity charge (~EUR 60,650/MW/year), found via general web search, not
  # verified against TenneT's primary tariff schedule (tennet.eu/tariffs).
  # A second component — a monthly max-demand "kW-max" charge (~EUR
  # 6,910/MW/month) — is a real additional cost this model does NOT yet
  # include; treat this figure as a lower bound on true transport cost, not
  # the full picture. Fixed/capacity-based, so it doesn't depend on dispatch
  # and isn't part of the LP objective — applied as a lump-sum deduction
  # after dispatch is computed (see src/costs.py).

backtest:
  start: "2021-01-01"
  end: "2025-09-30"
  # Cutoff is deliberate, not an oversight: on 1 Oct 2025 the European day-ahead
  # market (NL included) switched from hourly to 15-minute price intervals
  # (SDAC 15-minute MTU go-live). Ending here keeps the whole backtest at a
  # single, consistent hourly resolution matching the LP's design. Extending
  # past this date would require resampling 15-min prices to hourly, which
  # flattens exactly the intra-hour volatility a battery is meant to exploit.
